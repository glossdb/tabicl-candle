[project]
name = "dataraum-tabicl-oracle"
version = "0.1.0"
description = "Python oracle side: weight conversion and golden fixtures for the candle port"
requires-python = ">=3.13,<3.14"
dependencies = [
    "tabicl==2.1.1",
    "torch>=2.13",
    "numpy>=2",
    "safetensors>=0.4",
    "huggingface-hub>=0.30",  # scripts/_checkpoints.py fetches the checkpoints
]
