[package]
name = "tabicl-candle"
version = "0.1.0"
edition = "2024"
description = "TabICL forward pass in candle; graded against committed torch fixtures"
license = "MIT OR Apache-2.0"

[dependencies]
candle-core = "0.9"
candle-nn = "0.9"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
ndarray = "0.16"
ndarray-npy = "0.9"

[features]
metal = ["candle-core/metal", "candle-nn/metal"]
