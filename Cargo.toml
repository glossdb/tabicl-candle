[workspace]
resolver = "3"
members = [
    "crates/tabicl-model",
    "crates/tabicl-inference",
    "verify/experiments",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
candle-core = "0.11"
candle-nn = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ndarray = "0.16"
ndarray-npy = "0.9"
tabicl-model = { path = "crates/tabicl-model" }
tabicl-inference = { path = "crates/tabicl-inference" }

# The fidelity suite runs hundreds of small forwards; keep dependency
# kernels (candle's gemm above all) optimized even in dev builds.
[profile.dev.package."*"]
opt-level = 2
